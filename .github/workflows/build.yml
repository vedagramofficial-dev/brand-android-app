name: Build VEDA IPTV

on:
  push:
    branches:
      - feature/veda-iptv-scale
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Show Gradle files
        run: |
          echo '--- settings.gradle ---'
          cat settings.gradle 2>/dev/null || true
          echo '--- settings.gradle.kts ---'
          cat settings.gradle.kts 2>/dev/null || true
          echo '--- build.gradle ---'
          cat build.gradle 2>/dev/null || true
          echo '--- build.gradle.kts ---'
          cat build.gradle.kts 2>/dev/null || true
          echo '--- app/build.gradle ---'
          cat app/build.gradle 2>/dev/null || true
          echo '--- app/build.gradle.kts ---'
          cat app/build.gradle.kts 2>/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veda-iptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
