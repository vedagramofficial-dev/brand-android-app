name: Build VEDA IPTV

on:
  push:
    branches:
      - feature/veda-iptv-scale
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Show compile errors
        if: failure()
        run: |
          echo 'Searching Kotlin and Android compile errors'
          grep -R -n -E 'e: |error:|Unresolved reference|Cannot access|Compilation error' app/src || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veda-iptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
